# 水泵项目 ADF / Guardian v0.3 配置；schemaVersion 仍为 0.1 以保持兼容。
# 这里只保存路径、权威位置引用、检查模式和项目验证命令。
# 业务规则、API 字段、数据库结构和成本公式仍以项目代码及正式文档为准。

schemaVersion: "0.1"

policy:
  # 首次真实项目试运行只报告，不以规则失败阻断开发。
  reportOnly: true
  delivery:
    commit: manual
    pushFeatureBranch: manual
    createPullRequest: manual
    deployStaging: manual
    deployProduction: manual
    protectedBranches:
      - "main"
      - "master"

workflow:
  enabled: true
  contractPath: ".adf/tasks/current.md"
  requiredReviews:
    - "architecture"
    - "tests"
    - "docs"

project:
  name: "水泵工厂管理系统"
  sourceRoots:
    - "api"
    - "apps/web-next"
    - "freecad"
    - "scripts"
    - "tests"
    - ".adf"
    - ".agents/skills"
    - ".codex"

  modules:
    - id: "governance"
      paths:
        - ".gitignore"
        - ".adf/**"
        - ".agents/**"
        - ".codex/**"
        - "AGENTS.md"
        - ".guardian/**"
        - "docs/guardian-*"
    - id: "api"
      paths:
        - "api.cjs"
        - "api/**"
    - id: "web"
      paths:
        - "apps/web-next/**"
    - id: "tests"
      paths:
        - "tests/**"
    - id: "documentation"
      paths:
        - "README.md"
        - "docs/**"
    - id: "tooling"
      paths:
        - "package.json"
        - "package-lock.json"
        - "scripts/**"
    - id: "freecad"
      paths:
        - "freecad/**"

  authorities:
    architecture:
      - "AGENTS.md"
      - "docs/README.md"
      - "docs/modularization-design.md"
    api:
      - "docs/api-contract.md"
      - "docs/api-sop.md"
      - "docs/api-reference.md"
    database:
      - "docs/database-schema.md"
    businessFlow:
      - "docs/business-flow.md"
    technicalDebt:
      - "docs/technical-debt.md"

documentation:
  requiredFiles:
    - "README.md"
    - "AGENTS.md"
    - "docs/README.md"
    - "docs/api-contract.md"
    - "docs/api-sop.md"
    - "docs/api-reference.md"
    - "docs/database-schema.md"
    - "docs/business-flow.md"
    - "docs/technical-debt.md"

  mappings:
    - id: "api-contract"
      changedPaths:
        - "api/routes/**"
        - "api/capabilities/**"
        - "api/services/*Commands.cjs"
        - "api/services/*Queries.cjs"
        - "api/services/*Draft.cjs"
        - "api/services/*Preview.cjs"
        - "api/services/*Snapshot.cjs"
      authorityDocuments:
        - "docs/api-contract.md"
        - "docs/api-reference.md"
      testPaths:
        - "tests/**"
      severity: "failure"
      reviewKind: "api"

    - id: "database-schema"
      changedPaths:
        - "api/db.cjs"
        - "api/database/migrations.cjs"
      authorityDocuments:
        - "docs/database-schema.md"
      testPaths:
        - "tests/**"
      severity: "failure"

    - id: "cost-authority"
      changedPaths:
        - "api/services/costEngine.cjs"
        - "api/services/costQueries.cjs"
        - "api/services/recipeBomEngine.cjs"
        - "api/routes/cost.cjs"
      authorityDocuments:
        - "docs/api-reference.md"
        - "docs/business-flow.md"
      testPaths:
        - "tests/**"
      severity: "failure"
      reviewKind: "api"

    - id: "ai-capability"
      changedPaths:
        - "api/capabilities/**"
        - "api/routes/ai.cjs"
        - "api/routes/knowledge.cjs"
        - "api/routes/ai/**"
        - "api/services/ai*.cjs"
        - "api/services/knowledge*.cjs"
        - "api/services/*Ai*.cjs"
        - "api/services/*Knowledge*.cjs"
      authorityDocuments:
        - "docs/api-contract.md"
        - "docs/api-reference.md"
        - "docs/ai-learning-release-gate-guide.md"
      testPaths:
        - "tests/**"
      severity: "failure"
      reviewKind: "api"

    - id: "business-workflow"
      changedPaths:
        - "api/services/order*.cjs"
        - "api/services/quotation*.cjs"
        - "api/services/recipe*.cjs"
        - "api/services/*Recipe*Snapshot.cjs"
      authorityDocuments:
        - "docs/business-flow.md"
        - "docs/api-contract.md"
        - "docs/api-reference.md"
      testPaths:
        - "tests/**"
      severity: "failure"
      reviewKind: "api"

architecture:
  rules:
    - id: "web-no-bare-fetch"
      type: "forbidden-pattern"
      paths:
        - "apps/web-next/app/**"
        - "apps/web-next/components/**"
        - "apps/web-next/hooks/**"
      patterns:
        - '\bfetch\s*\('
      severity: "failure"
      message: "Web 新请求必须复用 apps/web-next/lib/api.ts 的统一请求入口。"

    - id: "ai-no-direct-database-import"
      type: "forbidden-import"
      paths:
        - "api/routes/ai/**"
      patterns:
        - '\brequire\s*\([^)]*db\.cjs'
        - '\bfrom\s+["''][^"'']*db\.cjs["'']'
      severity: "failure"
      message: "AI 层不得新增数据库直连，业务事实必须经正式 API 和 service。"

    - id: "routes-no-direct-sql"
      type: "direct-sql"
      paths:
        - "api/routes/**"
      severity: "failure"
      message: "Route 不得新增直接 SQL，应委托项目 service 或安全数据入口。"

    - id: "dynamic-update-through-safe-entry"
      type: "unsafe-dynamic-update"
      paths:
        - "api/**"
      patterns:
        - 'UPDATE\s+\$\{'
      allowPatterns:
        - '\bsafeUpdate\s*\('
      severity: "failure"
      message: "动态 UPDATE 必须通过 api/db.cjs 的 safeUpdate。"

    - id: "cost-calculation-authority"
      type: "authority-duplication"
      paths:
        - "apps/web-next/**"
        - "api/routes/ai/**"
      patterns:
        - '\b(?:totalCost|partCost|materialCost)\s*=\s*.*(?:reduce|\+|\*)'
        - '\.reduce\s*\([^)]*\bcost\b'
      severity: "warning"
      message: "发现疑似在 Web 或 AI 层复制成本计算，请核对 costEngine 和正式成本 API。"

    - id: "risky-persistence-defaults"
      type: "risky-pattern"
      paths:
        - "api/**"
        - "apps/web-next/**"
      patterns:
        - 'JSON\.stringify\s*\(\s*\{\s*\.\.\.'
        - '\b(?:amount|quantity|qty|version)\s*\|\|\s*0'
      severity: "warning"
      message: "请复核 JSON spread 持久化或数量、金额、版本的模糊默认值。"

technicalDebt:
  scanPaths:
    - "api/**"
    - "apps/web-next/**"
    - "freecad/**"
    - "scripts/**"
    - "tests/**"
  markers:
    - "TODO"
    - "FIXME"
    - "HACK"
  temporaryFilePatterns:
    - "**/*.tmp"
    - "**/*.bak"
    - "**/*-copy.*"
    - "**/debug-*"
  skippedTestMarkers:
    - ".skip"
  severity: "warning"

verification:
  commands:
    - id: "api-contract"
      run: "npm run verify:api-contract"
      phase: "focused"
      kind: "contract"
      timeoutSeconds: 180
    - id: "lint"
      run: "npm run lint"
      phase: "commit"
      kind: "other"
      timeoutSeconds: 600
    - id: "tests"
      run: "npm test"
      phase: "commit"
      kind: "test"
      timeoutSeconds: 900
    - id: "deep-api"
      run: "npm run test:deep-api"
      phase: "push"
      kind: "test"
      timeoutSeconds: 1200
    - id: "web-build"
      run: "npm run build"
      phase: "push"
      kind: "build"
      timeoutSeconds: 1800

exceptions: []

report:
  outputDirectory: ".guardian/reports"
  redactPatterns:
    - '(DEEPSEEK|KIMI|ALI)_[A-Z0-9_]*KEY\s*=\s*\S+'
    - '(?:ACCESS_PASSWORD|JWT_SECRET|INTERNAL_SECRET|MCP_TOKEN|MCP_SERVICE_TOKENS)\s*=\s*.*'
