<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>水泵助手 - 查询结果</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e1a;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.08);
    --text: #e4e8f1;
    --text-dim: #8891a5;
    --text-muted: #5a6378;
    --accent: #6c8aff;
    --accent-soft: rgba(108,138,255,0.12);
    --green: #34d399;
    --green-soft: rgba(52,211,153,0.12);
    --amber: #fbbf24;
    --amber-soft: rgba(251,191,36,0.12);
    --red: #f87171;
    --red-soft: rgba(248,113,113,0.12);
    --purple: #a78bfa;
    --purple-soft: rgba(167,139,250,0.12);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Inter', -apple-system, 'SF Pro Display', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 0 40px;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 24px;
    animation: fadeIn 0.4s ease;
  }
  .header .icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #6c8aff, #a78bfa);
    border-radius: 14px;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 24px;
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .header .time {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ── Speech Bubble ── */
  .speech-bubble {
    background: linear-gradient(135deg, rgba(108,138,255,0.15), rgba(167,139,250,0.1));
    border: 1px solid rgba(108,138,255,0.2);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 20px;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    animation: slideUp 0.4s ease 0.1s both;
  }

  /* ── AI Content ── */
  .ai-content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-dim);
    animation: slideUp 0.4s ease 0.2s both;
    white-space: pre-wrap;
  }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
    animation: slideUp 0.4s ease both;
    overflow: hidden;
  }
  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 14px;
  }
  .card-title .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── KPI Row ── */
  .kpi-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .kpi {
    background: var(--surface-hover);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .kpi-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .kpi-value {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .kpi-value.green { color: var(--green); }
  .kpi-value.amber { color: var(--amber); }
  .kpi-value.accent { color: var(--accent); }
  .kpi-value.red { color: var(--red); }
  .kpi-value.purple { color: var(--purple); }

  /* ── Table ── */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 500;
    font-size: 11px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .data-table td {
    padding: 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .data-table .total-row td {
    font-weight: 600;
    color: var(--accent);
    border-top: 2px solid var(--border);
  }

  /* ── Tags ── */
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .tag-green { background: var(--green-soft); color: var(--green); }
  .tag-amber { background: var(--amber-soft); color: var(--amber); }
  .tag-red { background: var(--red-soft); color: var(--red); }
  .tag-accent { background: var(--accent-soft); color: var(--accent); }
  .tag-purple { background: var(--purple-soft); color: var(--purple); }

  /* ── Loading / Error ── */
  .loading {
    text-align: center;
    padding: 80px 20px;
    animation: pulse 1.5s ease infinite;
  }
  .loading .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  .error-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--red);
    font-size: 15px;
  }

  /* ── Empty ── */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ── Animations ── */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div style="color:var(--text-muted);font-size:14px">加载中...</div>
  </div>
</div>

<script>
const app = document.getElementById('app');
const resultId = new URLSearchParams(location.search).get('id');

if (!resultId) {
  app.innerHTML = '<div class="error-msg">❌ 缺少结果ID</div>';
} else {
  fetch(`/api/siri/result/${resultId}`)
    .then(r => r.json())
    .then(data => {
      if (!data.success) throw new Error(data.error || '结果不存在或已过期');
      render(data.data);
    })
    .catch(err => {
      app.innerHTML = `<div class="error-msg">❌ ${err.message}</div>`;
    });
}

function render(result) {
  const { speech, content, toolResults, query, timestamp } = result;
  const time = new Date(timestamp).toLocaleString('zh-CN', { hour:'2-digit', minute:'2-digit' });

  let html = `
    <div class="header">
      <div class="icon">🎙</div>
      <h1>${escHtml(query || '查询结果')}</h1>
      <div class="time">${time}</div>
    </div>
    <div class="speech-bubble">${escHtml(speech)}</div>
  `;

  // Render tool result cards
  if (toolResults && toolResults.length > 0) {
    toolResults.forEach((tr, i) => {
      html += renderToolCard(tr, i);
    });
  }

  // AI full content
  if (content && content !== speech) {
    html += `<div class="ai-content">${escHtml(content)}</div>`;
  }

  app.innerHTML = html;
}

function renderToolCard(tr, index) {
  const delay = 0.3 + index * 0.1;
  const vt = tr.view_type;
  const data = tr.result?.data;
  if (!data) return '';

  switch (vt) {
    case 'bom_cost_card': return renderBomCard(data, delay);
    case 'inventory_table': return renderInventoryCard(data, delay);
    case 'order_detail_card': return renderOrderCard(data, delay);
    case 'dashboard_card': return renderDashboardCard(data, delay);
    case 'action_result': return renderActionCard(tr, delay);
    default: return renderGenericCard(tr, delay);
  }
}

function renderBomCard(d, delay) {
  const details = d.details || d.recipeCost?.details || [];
  const total = d.totalCost || d.recipeCost?.totalCost || '0';
  const name = d.recipeName || d.recipeCost?.recipeName || 'BOM成本';

  let tableRows = details.map(item => `
    <tr>
      <td>${escHtml(item.name || item.model)}</td>
      <td class="num">${item.qty}</td>
      <td class="num">¥${item.price}</td>
      <td class="num">¥${item.subtotal}</td>
    </tr>
  `).join('');

  // Stator cost
  let statorHtml = '';
  if (d.statorCost && d.statorCost.cost) {
    statorHtml = `
      <div class="kpi-row" style="margin-top:12px">
        <div class="kpi">
          <div class="kpi-label">线圈转子 (${d.statorCost.spec}-${d.statorCost.sheets})</div>
          <div class="kpi-value purple">¥${d.statorCost.cost}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">动态配置</div>
          <div class="kpi-value amber">¥${d.dynamicCost?.totalCost || '0'}</div>
        </div>
      </div>
    `;
  }

  return `
    <div class="card" style="animation-delay:${delay}s">
      <div class="card-title"><div class="dot" style="background:var(--accent)"></div>📦 ${escHtml(name)}</div>
      <div class="kpi-row">
        <div class="kpi" style="grid-column:span 2">
          <div class="kpi-label">总成本</div>
          <div class="kpi-value accent" style="font-size:28px">¥${total}</div>
        </div>
      </div>
      ${statorHtml}
      ${details.length > 0 ? `
        <table class="data-table">
          <tr><th>零件</th><th class="num">数量</th><th class="num">单价</th><th class="num">小计</th></tr>
          ${tableRows}
        </table>
      ` : ''}
    </div>
  `;
}

function renderInventoryCard(d, delay) {
  const items = Array.isArray(d) ? d : (d.list || []);
  if (items.length === 0) return '<div class="empty">暂无数据</div>';

  const rows = items.slice(0, 20).map(item => `
    <tr>
      <td>${escHtml(item.model || item.name || '-')}</td>
      <td>${escHtml(item.category || item.spec || '-')}</td>
      <td class="num">¥${item.price || item.savedCost || '-'}</td>
      <td class="num">${item.stock != null ? item.stock : '-'}</td>
    </tr>
  `).join('');

  return `
    <div class="card" style="animation-delay:${delay}s">
      <div class="card-title"><div class="dot" style="background:var(--green)"></div>📋 数据列表 (${items.length}项)</div>
      <table class="data-table">
        <tr><th>型号</th><th>类别</th><th class="num">单价</th><th class="num">库存</th></tr>
        ${rows}
      </table>
      ${items.length > 20 ? `<div style="text-align:center;color:var(--text-muted);font-size:12px;margin-top:8px">还有 ${items.length - 20} 项未显示</div>` : ''}
    </div>
  `;
}

function renderOrderCard(d, delay) {
  const order = Array.isArray(d) ? d[0] : d;
  if (!order) return '';

  const statusMap = { '待采购': 'tag-amber', '采购中': 'tag-accent', '已完成': 'tag-green' };
  const status = order['订单状态'] || order.status || '-';
  const tagClass = statusMap[status] || 'tag-accent';

  return `
    <div class="card" style="animation-delay:${delay}s">
      <div class="card-title"><div class="dot" style="background:var(--amber)"></div>📑 订单详情</div>
      <div class="kpi-row">
        <div class="kpi">
          <div class="kpi-label">客户</div>
          <div class="kpi-value" style="font-size:16px">${escHtml(order['客户名称'] || order.customer_name || '-')}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">状态</div>
          <div style="margin-top:4px"><span class="tag ${tagClass}">${escHtml(status)}</span></div>
        </div>
      </div>
    </div>
  `;
}

function renderDashboardCard(d, delay) {
  return `
    <div class="card" style="animation-delay:${delay}s">
      <div class="card-title"><div class="dot" style="background:var(--purple)"></div>📊 运营看板</div>
      <div class="kpi-row">
        <div class="kpi">
          <div class="kpi-label">订单总数</div>
          <div class="kpi-value accent">${d.totalOrders || d.orderCount || 0}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">配方数</div>
          <div class="kpi-value purple">${d.totalRecipes || d.recipeCount || 0}</div>
        </div>
      </div>
      <div class="kpi-row">
        <div class="kpi">
          <div class="kpi-label">总营收</div>
          <div class="kpi-value green">¥${d.totalRevenue || 0}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">总利润</div>
          <div class="kpi-value amber">¥${d.totalProfit || 0}</div>
        </div>
      </div>
    </div>
  `;
}

function renderActionCard(tr, delay) {
  const success = tr.result?.success;
  const data = tr.result?.data;
  const icon = success ? '✅' : '❌';

  let detail = '';
  if (data && typeof data === 'object') {
    // Copper price special case
    if (data.livePrice || data.livePricePerKg) {
      detail = `
        <div class="kpi-row">
          <div class="kpi">
            <div class="kpi-label">铜价 (元/吨)</div>
            <div class="kpi-value amber">¥${data.livePrice || '-'}</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">铜价 (元/千克)</div>
            <div class="kpi-value green">¥${data.livePricePerKg || '-'}</div>
          </div>
        </div>
      `;
    }
  }

  return `
    <div class="card" style="animation-delay:${delay}s">
      <div class="card-title"><div class="dot" style="background:${success ? 'var(--green)' : 'var(--red)'}"></div>${icon} ${escHtml(tr.name || '操作结果')}</div>
      ${detail}
    </div>
  `;
}

function renderGenericCard(tr, delay) {
  return `
    <div class="card" style="animation-delay:${delay}s">
      <div class="card-title"><div class="dot" style="background:var(--text-muted)"></div>📄 ${escHtml(tr.name || '数据')}</div>
      <pre style="font-size:12px;color:var(--text-dim);overflow-x:auto;white-space:pre-wrap">${escHtml(JSON.stringify(tr.result?.data, null, 2) || '无数据')}</pre>
    </div>
  `;
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
